name: Bug report / Ошибка
description: Report a reproducible problem. English or Russian is welcome.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / Версия
      placeholder: "0.7.0, Portable or Setup"
    validations:
      required: true
  - type: input
    id: equipment
    attributes:
      label: Windows, device and module / Windows, устройство и модуль
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      description: Describe the steps, expected result and what actually happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and relevant logs / Скриншоты и нужные строки журнала
      description: "Do not upload .lbbackup files, identity keys, your database or private notes. / Не загружайте резервные копии, ключи, базу и личные заметки."
